name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Build for wasm32
        run: cargo build --target wasm32-unknown-unknown

  embeddinggemma-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MODEL_URL: https://huggingface.co/unsloth/embeddinggemma-2-GGUF/resolve/main/embeddinggemma-2-Q8_0.gguf
      MODEL_SHA256: 6f1bd4ac6c5df7444f9cca7ca36cafe6cfa34cd6f49fefb1e0b4be8143aed8bc
      MODEL_PATH: ${{ github.workspace }}/.cache/embeddinggemma-2-Q8_0.gguf
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache the pinned EmbeddingGemma GGUF
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache/embeddinggemma-2-Q8_0.gguf
          key: embedgemma-q8-${{ env.MODEL_SHA256 }}
      - name: Download and verify the GGUF
        run: |
          mkdir -p "$(dirname "$MODEL_PATH")"
          if [ ! -f "$MODEL_PATH" ]; then
            curl -fL --retry 3 --retry-delay 2 -o "$MODEL_PATH" "$MODEL_URL"
          fi
          echo "$MODEL_SHA256  $MODEL_PATH" | sha256sum -c -
      - name: EmbeddingGemma tokenizer and forward parity
        run: |
          FRIEDFLAXIA_EMBED_GEMMA_GGUF="$MODEL_PATH" \
            cargo test --release --test bpe_real embeddinggemma_tokenizer -- --ignored --nocapture
          FRIEDFLAXIA_EMBED_GEMMA_GGUF="$MODEL_PATH" \
            cargo test --release --test embeddinggemma -- --ignored --nocapture

  d1-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MODEL_URL: https://huggingface.co/LiquidAI/d1-omni-600M-GGUF/resolve/main/d1-omni-600M-Q8_0.gguf
      MODEL_SHA256: cd94463f4cac9c700ec6750df8df005bb6846de410e159d1f5e985e1171693d3
      MODEL_PATH: ${{ github.workspace }}/.cache/d1-omni-600M-Q8_0.gguf
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache the pinned d1-omni GGUF
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache/d1-omni-600M-Q8_0.gguf
          key: d1-omni-q8-${{ env.MODEL_SHA256 }}
      - name: Download and verify the GGUF
        run: |
          mkdir -p "$(dirname "$MODEL_PATH")"
          if [ ! -f "$MODEL_PATH" ]; then
            curl -fL --retry 3 --retry-delay 2 -o "$MODEL_PATH" "$MODEL_URL"
          fi
          echo "$MODEL_SHA256  $MODEL_PATH" | sha256sum -c -
      - name: d1 tokenizer and decision parity
        run: |
          FRIEDFLAXIA_D1_GGUF="$MODEL_PATH" \
            cargo test --release --test bpe_real d1_tokenizer -- --ignored --nocapture
          FRIEDFLAXIA_D1_GGUF="$MODEL_PATH" \
            cargo test --release --test d1omni -- --ignored --nocapture

  plamo-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MODEL_URL: https://huggingface.co/pfnet/plamo-3-translate-0.8b-GGUF/resolve/main/plamo-3-translate-0.8b-Q4_0.gguf
      MODEL_SHA256: 33deed2822f799de4d15bb03bea1ac40efa7d663d9239ee54cc7f65f5ab92917
      MODEL_PATH: ${{ github.workspace }}/.cache/plamo-3-translate-0.8b-Q4_0.gguf
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache the pinned PLaMO GGUF
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache/plamo-3-translate-0.8b-Q4_0.gguf
          key: plamo-q4_0-${{ env.MODEL_SHA256 }}
      - name: Download and verify the GGUF
        run: |
          mkdir -p "$(dirname "$MODEL_PATH")"
          if [ ! -f "$MODEL_PATH" ]; then
            curl -fL --retry 3 --retry-delay 2 -o "$MODEL_PATH" "$MODEL_URL"
          fi
          echo "$MODEL_SHA256  $MODEL_PATH" | sha256sum -c -
      - name: PLaMO tokenizer and logits parity
        run: |
          FRIEDFLAXIA_PLAMO_GGUF="$MODEL_PATH" \
            cargo test --release --test unigram_real -- --ignored --nocapture
          FRIEDFLAXIA_PLAMO_GGUF="$MODEL_PATH" \
            cargo test --release --test plamo3 -- --ignored --nocapture
          FRIEDFLAXIA_PLAMO_GGUF="$MODEL_PATH" \
            cargo test --release -p friedflaxia-wasm --test plamo_generate -- --ignored --nocapture
