name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Build for wasm32
        run: cargo build --target wasm32-unknown-unknown
      - name: Install wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - name: Build the wasm-bindgen package
        # The generated package is what flaxia-crowd vendors, so CI must
        # exercise the same wasm-bindgen step as scripts/build-wasm.sh.
        run: ./scripts/build-wasm.sh web "$RUNNER_TEMP/friedflaxia-pkg"

  embeddinggemma-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MODEL_URL: https://huggingface.co/unsloth/embeddinggemma-2-GGUF/resolve/031f0d4b35536f69ab3509d4893c923264fcf253/embeddinggemma-2-Q8_0.gguf
      MODEL_SHA256: 6f1bd4ac6c5df7444f9cca7ca36cafe6cfa34cd6f49fefb1e0b4be8143aed8bc
      MODEL_PATH: ${{ github.workspace }}/.cache/embeddinggemma-2-Q8_0.gguf
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache the pinned EmbeddingGemma GGUF
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache/embeddinggemma-2-Q8_0.gguf
          key: embedgemma-q8-${{ env.MODEL_SHA256 }}
      - name: Download and verify the GGUF
        run: |
          mkdir -p "$(dirname "$MODEL_PATH")"
          if [ ! -f "$MODEL_PATH" ]; then
            curl -fL --retry 3 --retry-delay 2 -o "$MODEL_PATH" "$MODEL_URL"
          fi
          echo "$MODEL_SHA256  $MODEL_PATH" | sha256sum -c -
      - name: EmbeddingGemma tokenizer and forward parity
        run: |
          FRIEDFLAXIA_EMBED_GEMMA_GGUF="$MODEL_PATH" \
            cargo test --release --test bpe_real embeddinggemma_tokenizer -- --ignored --nocapture
          FRIEDFLAXIA_EMBED_GEMMA_GGUF="$MODEL_PATH" \
            cargo test --release --test embeddinggemma -- --ignored --nocapture

  d1-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MODEL_URL: https://huggingface.co/LiquidAI/d1-omni-600M-GGUF/resolve/8eb2d2a1c5404bba8a34a88bd8e159c242197d51/d1-omni-600M-Q8_0.gguf
      MODEL_SHA256: cd94463f4cac9c700ec6750df8df005bb6846de410e159d1f5e985e1171693d3
      MODEL_PATH: ${{ github.workspace }}/.cache/d1-omni-600M-Q8_0.gguf
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache the pinned d1-omni GGUF
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache/d1-omni-600M-Q8_0.gguf
          key: d1-omni-q8-${{ env.MODEL_SHA256 }}
      - name: Download and verify the GGUF
        run: |
          mkdir -p "$(dirname "$MODEL_PATH")"
          if [ ! -f "$MODEL_PATH" ]; then
            curl -fL --retry 3 --retry-delay 2 -o "$MODEL_PATH" "$MODEL_URL"
          fi
          echo "$MODEL_SHA256  $MODEL_PATH" | sha256sum -c -
      - name: d1 tokenizer and decision parity
        run: |
          FRIEDFLAXIA_D1_GGUF="$MODEL_PATH" \
            cargo test --release --test bpe_real d1_tokenizer -- --ignored --nocapture
          FRIEDFLAXIA_D1_GGUF="$MODEL_PATH" \
            cargo test --release --test d1omni -- --ignored --nocapture

  multimodal-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TEXT_SHA256: 6f1bd4ac6c5df7444f9cca7ca36cafe6cfa34cd6f49fefb1e0b4be8143aed8bc
      MMPROJ_SHA256: 0531309472a6bc6f4b146c3736eee7795ec9db1903c25490d3c937490cef6dd8
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache EmbeddingGemma text and mmproj GGUFs
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.cache/embeddinggemma-2-Q8_0.gguf
            ${{ github.workspace }}/.cache/mmproj-embeddinggemma-2-Q8_0.gguf
          key: embedgemma-mm-${{ env.TEXT_SHA256 }}-${{ env.MMPROJ_SHA256 }}
      - name: Download and verify the GGUFs
        run: |
          mkdir -p .cache
          test -f .cache/embeddinggemma-2-Q8_0.gguf || curl -fL --retry 3 -o .cache/embeddinggemma-2-Q8_0.gguf \
            https://huggingface.co/unsloth/embeddinggemma-2-GGUF/resolve/031f0d4b35536f69ab3509d4893c923264fcf253/embeddinggemma-2-Q8_0.gguf
          test -f .cache/mmproj-embeddinggemma-2-Q8_0.gguf || curl -fL --retry 3 -o .cache/mmproj-embeddinggemma-2-Q8_0.gguf \
            https://huggingface.co/ggml-org/embeddinggemma-2-GGUF/resolve/6ea3e3a309d12a4779cfda98b8c19800d2d5da71/mmproj-embeddinggemma-2-Q8_0.gguf
          echo "$TEXT_SHA256  .cache/embeddinggemma-2-Q8_0.gguf" | sha256sum -c -
          echo "$MMPROJ_SHA256  .cache/mmproj-embeddinggemma-2-Q8_0.gguf" | sha256sum -c -
      - name: Vision, audio and end-to-end parity
        run: |
          FRIEDFLAXIA_MMPROJ="$PWD/.cache/mmproj-embeddinggemma-2-Q8_0.gguf" \
            cargo test --release --test vision -- --ignored --nocapture
          FRIEDFLAXIA_MMPROJ="$PWD/.cache/mmproj-embeddinggemma-2-Q8_0.gguf" \
            cargo test --release --test audio -- --ignored --nocapture
          FRIEDFLAXIA_EMBED_GGUF="$PWD/.cache/embeddinggemma-2-Q8_0.gguf" \
            FRIEDFLAXIA_MMPROJ="$PWD/.cache/mmproj-embeddinggemma-2-Q8_0.gguf" \
            cargo test --release --test embedding_mm -- --ignored --nocapture
          FRIEDFLAXIA_EMBED_GGUF="$PWD/.cache/embeddinggemma-2-Q8_0.gguf" \
            FRIEDFLAXIA_MMPROJ="$PWD/.cache/mmproj-embeddinggemma-2-Q8_0.gguf" \
            cargo test --release -p friedflaxia-wasm --test multimodal -- --ignored --nocapture

  d1-media-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MMPROJ_SHA256: df887978550cdbb45f0f57d7b436a0f844689f9f561395a144ced500606c3a89
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache the d1 mmproj GGUF
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache/mmproj-d1-omni-600M-Q8_0.gguf
          key: d1-mmproj-${{ env.MMPROJ_SHA256 }}
      - name: Download and verify the GGUF
        run: |
          mkdir -p .cache
          test -f .cache/mmproj-d1-omni-600M-Q8_0.gguf || curl -fL --retry 3 -o .cache/mmproj-d1-omni-600M-Q8_0.gguf \
            https://huggingface.co/LiquidAI/d1-omni-600M-GGUF/resolve/8eb2d2a1c5404bba8a34a88bd8e159c242197d51/mmproj-d1-omni-600M-Q8_0.gguf
          echo "$MMPROJ_SHA256  .cache/mmproj-d1-omni-600M-Q8_0.gguf" | sha256sum -c -
      - name: d1 vision and audio parity
        run: |
          FRIEDFLAXIA_D1_MMPROJ="$PWD/.cache/mmproj-d1-omni-600M-Q8_0.gguf" \
            cargo test --release --test d1_vision -- --ignored --nocapture
          FRIEDFLAXIA_D1_MMPROJ="$PWD/.cache/mmproj-d1-omni-600M-Q8_0.gguf" \
            cargo test --release --test d1_audio -- --ignored --nocapture

  nudenet-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install converter dependencies
        run: pip install --quiet numpy onnx gguf
      - name: Download pinned NudeNet ONNX weights
        run: |
          curl -fL --retry 3 -o /tmp/320n.onnx \
            https://huggingface.co/deepghs/nudenet_onnx/resolve/44956a0587943016350c7815f9e0dec089d45cae/320n.onnx
      - name: Convert to GGUF and run parity
        run: |
          python3 tools/convert_nudenet.py /tmp/320n.onnx /tmp/nudenet-320n-f32.gguf
          FRIEDFLAXIA_NUDENET_GGUF=/tmp/nudenet-320n-f32.gguf \
            cargo test --release --test nudenet -- --ignored --nocapture
          cargo test --release --test nudenet -- --nocapture

  dllm-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MODEL_URL: https://huggingface.co/RemydreScarlet/qwen3-0.6b-diffusion-bd3lm-GGUF/resolve/fd3fb1978befe31cff16ab6cfcd4d5184cca0e9b/qwen3-bd3lm-q4_0.gguf
      MODEL_SHA256: 0f13278bde4d700118c8cf13d293af897a8974e74293de887aa383c567352a8e
      MODEL_PATH: ${{ github.workspace }}/.cache/qwen3-bd3lm-q4_0.gguf
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache the pinned dLLM GGUF
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache/qwen3-bd3lm-q4_0.gguf
          key: dllm-q4_0-${{ env.MODEL_SHA256 }}
      - name: Download and verify the GGUF
        run: |
          mkdir -p "$(dirname "$MODEL_PATH")"
          if [ ! -f "$MODEL_PATH" ]; then
            curl -fL --retry 3 -o "$MODEL_PATH" "$MODEL_URL"
          fi
          echo "$MODEL_SHA256  $MODEL_PATH" | sha256sum -c -
      - name: Run the dLLM smoke test and the Qwen3 tokenizer contract
        run: |
          FRIEDFLAXIA_DLLM_GGUF="$MODEL_PATH" \
            cargo test --release --test dllm -- --ignored --nocapture
          cargo test --release --test dllm -- --nocapture

  plamo-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MODEL_URL: https://huggingface.co/pfnet/plamo-3-translate-0.8b-GGUF/resolve/1cf96ae02133958a20074bfdfab76517bb737d00/plamo-3-translate-0.8b-Q4_0.gguf
      MODEL_SHA256: 33deed2822f799de4d15bb03bea1ac40efa7d663d9239ee54cc7f65f5ab92917
      MODEL_PATH: ${{ github.workspace }}/.cache/plamo-3-translate-0.8b-Q4_0.gguf
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache the pinned PLaMO GGUF
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache/plamo-3-translate-0.8b-Q4_0.gguf
          key: plamo-q4_0-${{ env.MODEL_SHA256 }}
      - name: Download and verify the GGUF
        run: |
          mkdir -p "$(dirname "$MODEL_PATH")"
          if [ ! -f "$MODEL_PATH" ]; then
            curl -fL --retry 3 --retry-delay 2 -o "$MODEL_PATH" "$MODEL_URL"
          fi
          echo "$MODEL_SHA256  $MODEL_PATH" | sha256sum -c -
      - name: PLaMO tokenizer and logits parity
        run: |
          FRIEDFLAXIA_PLAMO_GGUF="$MODEL_PATH" \
            cargo test --release --test unigram_real -- --ignored --nocapture
          FRIEDFLAXIA_PLAMO_GGUF="$MODEL_PATH" \
            cargo test --release --test plamo3 -- --ignored --nocapture
          FRIEDFLAXIA_PLAMO_GGUF="$MODEL_PATH" \
            cargo test --release -p friedflaxia-wasm --test plamo_generate -- --ignored --nocapture
